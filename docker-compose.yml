# Environnement local complet : PostgreSQL, Redis, MinIO (stockage S3), migrations et application.
# Usage : cp .env.example .env (puis renseigner les secrets) ; docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talent}
      POSTGRES_DB: talentbridge
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent -d talentbridge"]
      interval: 5s
      retries: 10

  redis:
    # Prévu pour le limiteur de débit et les files distribuées (voir docs/FEATURES.md) ; non requis aujourd'hui.
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-talentbridge}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-talentbridge-secret}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID:-talentbridge} $${S3_SECRET_ACCESS_KEY:-talentbridge-secret}; do sleep 2; done;
             mc mb --ignore-existing local/$${S3_BUCKET:-talentbridge}"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-talentbridge}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-talentbridge-secret}
      S3_BUCKET: ${S3_BUCKET:-talentbridge}

  migrate:
    build: { context: ., target: tools }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://talent:${POSTGRES_PASSWORD:-talent}@db:5432/talentbridge
    depends_on:
      db: { condition: service_healthy }
    # Migrations puis seed (référentiels + démo si DEMO_SEED=true).
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"

  app:
    build: { context: ., target: runner }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://talent:${POSTGRES_PASSWORD:-talent}@db:5432/talentbridge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports: ["3000:3000"]
    volumes: [appstorage:/app/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  miniodata:
  appstorage:
